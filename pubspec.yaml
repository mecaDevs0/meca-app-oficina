name: meca_app_oficina
description: MECA - App da Oficina para gestão de agendamentos
version: 1.5.2+108

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  http: ^1.1.0
  fl_chart: ^0.66.0
  image_picker: ^1.0.4
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  permission_handler: ^11.0.1
  flutter_image_compress: ^2.0.4
  cached_network_image: ^3.3.0
  onesignal_flutter: ^5.0.0
  url_launcher: ^6.2.5
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/logos/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/icone_oficina_full.png"
  adaptive_icon_background: "#252940"
  adaptive_icon_foreground: "assets/logos/icone_oficina_full.png"
































